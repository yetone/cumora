# Publish the `cumora` BYOA CLI to npm.
#
# Why this exists: the npm account has 2FA (auth + writes), so a manual
# `npm publish` prompts for an interactive OTP every release. An npm
# *automation* token bypasses 2FA for writes, so CI can publish without a
# human-entered code. Unlike the server (build.yml produces a candidate image
# that deploy.yml then rolls out on an explicit dispatch), the CLI publishes
# straight from a push to main — an npm version is immutable and additive, so
# there's no production state to mutate.
#
# Setup (one-time): create an automation token at
#   npmjs.com → Access Tokens → Generate → "Automation"
# and add it as the repo secret `NPM_TOKEN`. Until that secret exists this
# workflow no-ops cleanly (it does NOT fail), so adding the file is safe.
#
# Behaviour: on a push to main that touches agent-cli/ (typically the
# `chore(agent-cli): release cumora@X` version bump), publish that version
# — but only if it isn't already on the registry, so re-pushes are no-ops.

name: Publish CLI

on:
  push:
    branches: [main]
    paths: ['agent-cli/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish cumora
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gate on NPM_TOKEN presence
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping publish. Add an npm automation token as the NPM_TOKEN secret to enable auto-publish."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # build.mjs (run by agent-cli's prepublishOnly) imports esbuild, which
      # lives in the repo-root node_modules — so install at the root.
      - name: Install root deps (for the bundle build)
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: Publish if this version is new
        if: steps.gate.outputs.go == '1'
        working-directory: agent-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "→ $NAME@$VER already on npm; nothing to publish."
          else
            echo "→ publishing $NAME@$VER"
            npm publish --access public
          fi
