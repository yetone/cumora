# PR checks — fast feedback on every pull request to main.
#
# Intentionally cheap: just tsc on both projects, plus `npm test` if a
# test script exists. No Docker, no GCP auth, no secrets — these run
# safely on forks too.

name: PR

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR — saves CI minutes when you
# push twice in a row.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P0 tripwire: the BIG (brain) model may ONLY do real, heavy tasks. Any
  # ungated big-model selection is a P0 incident. This job runs the static
  # scanner first and fast — no npm install, no deps — so a regression turns
  # the PR red loudly before anything else even starts. See
  # scripts/guard-big-brain.mjs (also enforced by `npm test`).
  big-brain-guard:
    name: Big-brain guard (P0)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No unnecessary big-brain use
        run: node scripts/guard-big-brain.mjs

  # P1 tripwire: every sub2api callsite must go through getTrackedLlmClient()
  # so the llm_calls ledger captures the spend with a business purpose. A
  # raw getLlmClient() outside the small allowlist silently drops that call
  # from per-purpose rollups (the "which business burned the mini" answer
  # quietly drifts wrong). Same fast-fail shape as the big-brain guard.
  llm-tracked-guard:
    name: LLM-tracked guard (P1)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Every sub2api call tracked in llm_calls
        run: node scripts/guard-llm-tracked.mjs

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Biome lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: tsc (client)
        run: npx tsc --noEmit
      # `tsc (server)` was previously misconfigured to point at
      # tsconfig.node.json, whose `include` is just ["vite.config.ts"] —
      # so it typechecked exactly ONE file and missed every server bug
      # the name implied it was catching. Fixed in this commit to call
      # `npm run server:typecheck` which uses server/tsconfig.json
      # (include: src/**/*). Catches the "added an import but didn't
      # commit the matching export" class of bug that took prod down
      # for hours in mid-May 2026.
      - name: tsc (server)
        run: npm run server:typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm test` (server/src/__tests__ + workers) boots env.ts and opens
    # Postgres/Redis connections, so this job needs the same service
    # containers + env as build.yml's quality job — without them tests
    # hang on ECONNREFUSED until the job times out. Dummy secrets only;
    # unit tests never reach a real provider. (pgvector isn't needed here —
    # build.yml runs `npm test` before enabling the extension.)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # `npm test` runs workers/**/*.test.ts too, and the email-gate
      # worker has its own dependencies (postal-mime) that the root
      # install doesn't pull in. Install them or those tests fail with
      # "Cannot find module 'postal-mime'". Mirrors build.yml's quality job.
      - name: Install Email Worker dependencies
        run: npm ci --prefix workers/email-gate
      # `npm test` returns exit code 1 when the script is missing. We
      # want a soft no-op until tests exist — skip if there's no `test`
      # script in package.json. Once a test script is added, this job
      # runs it automatically.
      - name: Run tests if defined
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test --silent
          else
            echo "no `test` script in package.json — skipping"
          fi

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres + Redis service containers — `npm run test:integration`
    # talks to these via INTEGRATION_DATABASE_URL + REDIS_URL.
    # `pgvector/pgvector` includes pgvector preinstalled so the memory
    # embedding tests have a working ::vector cast available.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        # Wait until the DB is actually accepting connections before the
        # test runner tries to migrate. The runner has its own ensureSchema
        # but if postgres is still booting it'll see an ECONNREFUSED.
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      # Force mock Resend — the runner enforces this too, but doubling
      # up here makes a misconfiguration loud.
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      # Required by env.ts on boot; values are dummy for CI.
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Install pgvector extension into the test DB. `pgvector/pgvector`
      # ships the .so; CREATE EXTENSION needs to actually run once per DB.
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=cumora psql -h localhost -U cumora -d cumora_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run integration suite
        run: npm run test:integration
